name: Build RootFS (Arch + KDE)

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: '桌面环境'
        type: choice
        options: [kde, gnome, none]
        default: kde
      partlabel:
        description: 'rootfs 分区 (单系统=userdata, 双系统=linux)'
        type: choice
        options: [userdata, linux]
        default: userdata
      password:
        description: '登录密码 (用户 xiaomi)'
        type: string
        default: 'xiaomi'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/boost /opt/az /usr/local/share/conda /opt/microsoft /opt/powershell 2>/dev/null || true
          df -h /

      - name: Download Arch bootstrap
        run: |
          cd /tmp
          curl -fL --retry 3 --retry-delay 5 -o archboot.tar.zstd \
            "https://geo.mirror.pkgbuild.com/iso/latest/archlinux-bootstrap-x86_64.tar.zst"
          ls -la archboot.tar.zstd

      - name: Extract bootstrap
        run: |
          sudo mkdir -p /opt/arch
          sudo tar --zstd -xf /tmp/archboot.tar.zstd -C /opt/arch
          test -x /opt/arch/root.x86_64/usr/bin/pacman && echo "bootstrap OK"

      - name: Prepare chroot (mounts + resolv + packages)
        run: |
          CH=/opt/arch/root.x86_64
          command -v systemd-nspawn >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq systemd-container; }
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /tmp/mirrorlist
          sudo cp /tmp/mirrorlist $CH/etc/pacman.d/mirrorlist
          echo '--- mirrorlist ---'; sudo cat $CH/etc/pacman.d/mirrorlist
          sudo cp /etc/resolv.conf $CH/etc/resolv.conf
          sudo mkdir -p $CH/build
          sudo mount --bind "$GITHUB_WORKSPACE" $CH/build
          echo '--- host df ---'; df -h /
          sudo mkdir -p $CH/var/cache/pacman/pkg
          sudo mkdir -p $CH/var/tmp/pacman-cache
          sudo grep -q '^CacheDir' $CH/etc/pacman.conf || sudo sed -i '/^\[options\]/a CacheDir = /var/tmp/pacman-cache' $CH/etc/pacman.conf
          echo '--- nspawn test ---'
          sudo systemd-nspawn -D $CH --register=no --quiet /bin/bash -c 'echo NSPAWN_OK; pwd'
          echo '--- pacman install via nspawn ---'
          sudo systemd-nspawn -D $CH --register=no /bin/bash -euxc '
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm
            pacman -S --noconfirm base-devel sudo git arch-install-scripts devtools ripgrep
          '

      - name: Pre-create build chroot (bypass mkarchroot)
        run: |
          CH=/opt/arch/root.x86_64
          sudo systemd-nspawn -D $CH --register=no /bin/bash -euxc '
            echo "=== arch-install-scripts version ==="
            pacman -Q arch-install-scripts devtools
            echo "=== mkarchroot usage ==="
            mkarchroot 2>&1 | head -5 || true
            echo "=== pre-create chroot via pacstrap ==="
            mkdir -p /var/lib/archbuild
            if [ -d /var/lib/archbuild/root ]; then
              echo "root already exists, skip"
            else
              pacstrap -c /var/lib/archbuild/root base-devel
              echo "=== locale ==="
              echo "en_US.UTF-8 UTF-8" >> /var/lib/archbuild/root/etc/locale.gen
              arch-chroot /var/lib/archbuild/root locale-gen || true
            fi
            echo "=== verify ==="
            ls /var/lib/archbuild/root/ | head -8
            arch-chroot /var/lib/archbuild/root pacman -Q base-devel || true
          '

      - name: Build rootfs + boot
        run: |
          CH=/opt/arch/root.x86_64
          sudo systemd-nspawn -D $CH --register=no /bin/bash -euxc "
            cd /build
            NO_COLOR=1 make all ROOTFS_ARGS='--desktop ${{ inputs.desktop }} --partlabel ${{ inputs.partlabel }} --size 6144 --user xiaomi --password ${{ inputs.password }} --extra \"fcitx5 fcitx5-chinese-addons rustdesk\"'
          "

      - name: Locate images
        id: find
        run: |
          CH=/opt/arch/root.x86_64
          ROOTFS=$(sudo find $CH/build/out -name 'rootfs.img' -size +1G | head -1)
          BOOT=$(sudo find $CH/build/out -name 'boot.img' -size +1M | head -1)
          echo "rootfs=$ROOTFS"
          echo "boot=$BOOT"
          test -n "$ROOTFS" || { echo "rootfs.img 未找到"; sudo find $CH/build/out -type f | head -50; exit 1; }
          test -n "$BOOT" || { echo "boot.img 未找到"; exit 1; }
          echo "ROOTFS_PATH=$ROOTFS" >> "$GITHUB_OUTPUT"
          echo "BOOT_PATH=$BOOT" >> "$GITHUB_OUTPUT"
          sudo chmod 644 "$ROOTFS" "$BOOT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-sheng-images
          path: |
            ${{ steps.find.outputs.ROOTFS_PATH }}
            ${{ steps.find.outputs.BOOT_PATH }}
          if-no-files-found: error
          compression-level: 0
