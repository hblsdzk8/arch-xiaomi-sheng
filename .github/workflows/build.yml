name: Build RootFS (Arch + KDE)

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: '桌面环境'
        type: choice
        options: [kde, gnome, none]
        default: kde
      partlabel:
        description: 'rootfs 分区 (单系统=userdata, 双系统=linux)'
        type: choice
        options: [userdata, linux]
        default: userdata
      password:
        description: '登录密码 (用户 xiaomi)'
        type: string
        default: 'xiaomi'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/boost /opt/az /usr/local/share/conda /opt/microsoft /opt/powershell 2>/dev/null || true
          df -h /

      - name: Download Arch Linux ARM bootstrap
        run: |
          cd /tmp
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o alarm.tar.gz \
            https://archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz \
            || curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o alarm.tar.gz \
            http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          ls -la alarm.tar.gz

      - name: Extract bootstrap
        run: |
          sudo mkdir -p /opt/arch/root.aarch64
          sudo tar -xzf /tmp/alarm.tar.gz -C /opt/arch/root.aarch64
          test -x /opt/arch/root.aarch64/usr/bin/pacman && echo "ALARM bootstrap OK"
          rm -f /tmp/alarm.tar.gz

      - name: Prepare chroot (mounts + resolv + packages)
        run: |
          CH=/opt/arch/root.aarch64
          command -v systemd-nspawn >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq systemd-container; }
          if [ -L "$CH/etc/machine-id" ]; then sudo rm -f "$CH/etc/machine-id"; fi
          sudo systemd-machine-id-setup --root="$CH"
          echo "bootstrap machine-id: $(cat "$CH/etc/machine-id" 2>/dev/null || echo MISSING)"
          if [ -f /run/systemd/resolve/resolv.conf ]; then
            RESOLV_SRC=/run/systemd/resolve/resolv.conf
          else
            RESOLV_SRC=/etc/resolv.conf
          fi
          sudo rm -f $CH/etc/resolv.conf
          sudo cp -fL "$RESOLV_SRC" $CH/etc/resolv.conf
          for ns in 1.1.1.1 8.8.8.8; do
            grep -q "nameserver $ns" $CH/etc/resolv.conf 2>/dev/null || echo "nameserver $ns" | sudo tee -a $CH/etc/resolv.conf >/dev/null
          done
          echo '--- resolv.conf ---'
          sudo ls -la $CH/etc/resolv.conf
          sudo cat $CH/etc/resolv.conf
          echo '--- host DNS ---'
          getent hosts mirror.archlinuxarm.org || echo HOST_DNS_FAIL_mirror
          getent hosts geo.mirror.pkgbuild.com || echo HOST_DNS_FAIL_pkgbuild
          printf 'Server = http://nj.us.mirror.archlinuxarm.org/$arch/$repo\nServer = http://ca.us.mirror.archlinuxarm.org/$arch/$repo\nServer = http://fl.us.mirror.archlinuxarm.org/$arch/$repo\nServer = http://tw.mirror.archlinuxarm.org/$arch/$repo\nServer = http://mirror.archlinuxarm.org/$arch/$repo\nServer = http://50.116.36.110/$arch/$repo\n' | sudo tee $CH/etc/pacman.d/mirrorlist >/dev/null
          echo '--- mirrorlist ---'
          sudo cat $CH/etc/pacman.d/mirrorlist
          sudo mkdir -p $CH/build
          sudo mount --bind "$GITHUB_WORKSPACE" $CH/build
          sudo chmod -R a+rwX $CH/build/pkgs
          echo '--- file modes (must stay 644/755 for deterministic tar) ---'
          sudo stat -c '%a %n' $CH/build/files/install/hexagonrpc/* | head -5
          echo '--- host df ---'; df -h /
          sudo mkdir -p $CH/var/cache/pacman/pkg
          sudo mkdir -p $CH/var/tmp/pacman-cache
          sudo grep -q '^CacheDir' $CH/etc/pacman.conf || sudo sed -i '/^\[options\]/a CacheDir = /var/tmp/pacman-cache' $CH/etc/pacman.conf
          sudo sed -i 's/^DownloadUser/#DownloadUser/' $CH/etc/pacman.conf
          sudo sed -i 's/^#DisableSandboxFilesystem/DisableSandboxFilesystem/' $CH/etc/pacman.conf
          sudo sed -i 's/^#DisableSandboxSyscalls/DisableSandboxSyscalls/' $CH/etc/pacman.conf
          echo '--- pacman sandbox settings ---'
          sudo grep -E 'DownloadUser|DisableSandbox' $CH/etc/pacman.conf || true
          echo '--- nspawn test ---'
          sudo systemd-nspawn -D $CH --register=no --resolv-conf=off --quiet /bin/bash -c 'echo NSPAWN_OK; cat /etc/resolv.conf'
          echo '--- pacman install via nspawn ---'
          sudo systemd-nspawn -D $CH --register=no --resolv-conf=off /bin/bash -euxc '
            echo "--- container DNS diag ---"
            cat /etc/resolv.conf
            getent hosts mirror.archlinuxarm.org || echo CONTAINER_DNS_FAIL_mirror
            (exec 3<>/dev/tcp/50.116.36.110/80 && echo TCP_IP_OK && exec 3>&-) || echo TCP_IP_FAIL
            pacman-key --init
            pacman-key --populate archlinuxarm
            pacman -Syu --noconfirm
            pacman -S --noconfirm base-devel sudo git arch-install-scripts devtools ripgrep
            useradd -m build || true
            id build
          '

      - name: Pre-create build chroot (bypass mkarchroot)
        run: |
          CH=/opt/arch/root.aarch64
          if ! grep -q -- '--keep-unit' $CH/usr/bin/arch-nspawn; then
            sudo sed -i 's/--register=no/&\n\t--keep-unit/' $CH/usr/bin/arch-nspawn
          fi
          if ! grep -q 'DISABLED mirrorlist overwrite' $CH/usr/bin/arch-nspawn; then
            sudo sed -i 's|.*printf.*pacman\.d/mirrorlist.*|# DISABLED mirrorlist overwrite: &|' $CH/usr/bin/arch-nspawn
          fi
          echo '--- arch-nspawn patched lines ---'
          grep -n 'keep-unit\|mirrorlist' $CH/usr/bin/arch-nspawn
          sudo systemd-nspawn -D $CH --register=no --resolv-conf=off /bin/bash -euxc '
            echo "=== pacman-conf --repo extra Server (diagnostic) ==="
            pacman-conf --repo extra Server || true
            echo "=== bootstrap mirrorlist ==="
            cat /etc/pacman.d/mirrorlist
            echo "=== arch-install-scripts version ==="
            pacman -Q arch-install-scripts devtools
            echo "=== mkarchroot usage ==="
            mkarchroot 2>&1 | head -5 || true
            echo "=== pre-create chroot via pacstrap ==="
            mkdir -p /var/lib/archbuild/root
            if [ -d /var/lib/archbuild/root ] && [ -z "$(ls -A /var/lib/archbuild/root 2>/dev/null)" ]; then
              pacstrap -c /var/lib/archbuild/root base-devel
              echo "=== locale ==="
              echo "en_US.UTF-8 UTF-8" >> /var/lib/archbuild/root/etc/locale.gen
              arch-chroot /var/lib/archbuild/root locale-gen || true
              echo "=== create build user (as mkarchroot would) ==="
              arch-chroot /var/lib/archbuild/root useradd -m -G wheel build || true
              echo "build ALL=(ALL) NOPASSWD: ALL" >> /var/lib/archbuild/root/etc/sudoers
              arch-chroot /var/lib/archbuild/root getent passwd build || echo "USER_MISSING"
            else
              echo "root exists (maybe non-empty), continuing"
            fi
            echo "=== write .arch-chroot marker (arch-nspawn requires it) ==="
            CHROOT_VER=$(grep CHROOT_VERSION= /usr/share/devtools/lib/archroot.sh | head -1 | cut -d= -f2- | tr -dc "a-zA-Z0-9")
            echo "CHROOT_VERSION=$CHROOT_VER"
            echo "$CHROOT_VER" > /var/lib/archbuild/root/.arch-chroot
            cat /var/lib/archbuild/root/.arch-chroot
            echo "=== machine-id (mkarchroot does this too) ==="
            systemd-machine-id-setup --root=/var/lib/archbuild/root
            cat /var/lib/archbuild/root/etc/machine-id
            echo "LANG=C.UTF-8" > /var/lib/archbuild/root/etc/locale.conf
            echo "=== disable pacman sandbox in clean chroot (pacstrap installs default conf) ==="
            sed -i "s/^DownloadUser/#DownloadUser/" /var/lib/archbuild/root/etc/pacman.conf
            sed -i "s/^#DisableSandboxFilesystem/DisableSandboxFilesystem/" /var/lib/archbuild/root/etc/pacman.conf
            sed -i "s/^#DisableSandboxSyscalls/DisableSandboxSyscalls/" /var/lib/archbuild/root/etc/pacman.conf
            grep -E "DownloadUser|DisableSandbox" /var/lib/archbuild/root/etc/pacman.conf || true
            echo "=== verify ==="
            ls /var/lib/archbuild/root/ | head -8
            arch-chroot /var/lib/archbuild/root pacman -Q base-devel || true
          '

      - name: Debug files.tar.gz checksum
        run: |
          CH=/opt/arch/root.aarch64
          sudo systemd-nspawn -D $CH --register=no --resolv-conf=off /bin/bash -euxc '
            cd /build
            echo "=== source file modes ==="
            stat -c "%a %n" files/install/hexagonrpc/*
            echo "=== mktemp dir mode ==="
            d=$(mktemp -d); stat -c "%a" "$d"; rm -rf "$d"
            echo "=== expected (PKGBUILD) ==="
            grep -A2 "files.tar.gz" pkgs/hexagonrpc/PKGBUILD
            echo "=== generate ==="
            ./scripts/package-files.sh --pkg hexagonrpc
            sha256sum pkgs/hexagonrpc/files.tar.gz
            tar -tvzf pkgs/hexagonrpc/files.tar.gz
          '

      - name: Build rootfs + boot
        run: |
          CH=/opt/arch/root.aarch64
          sudo systemd-nspawn -D $CH --register=no --resolv-conf=off /bin/bash -euxc "
            cd /build
            NO_COLOR=1 make all ROOTFS_ARGS='--desktop ${{ inputs.desktop }} --partlabel ${{ inputs.partlabel }} --size 6144 --user xiaomi --password ${{ inputs.password }} --extra \"fcitx5 fcitx5-chinese-addons\"'
          "

      - name: Locate images
        id: find
        run: |
          CH=/opt/arch/root.aarch64
          ROOTFS=$(sudo find $CH/build/out -name 'rootfs.img' -size +1G | head -1)
          BOOT=$(sudo find $CH/build/out -name 'boot.img' -size +1M | head -1)
          echo "rootfs=$ROOTFS"
          echo "boot=$BOOT"
          test -n "$ROOTFS" || { echo "rootfs.img 未找到"; sudo find $CH/build/out -type f | head -50; exit 1; }
          test -n "$BOOT" || { echo "boot.img 未找到"; exit 1; }
          echo "ROOTFS_PATH=$ROOTFS" >> "$GITHUB_OUTPUT"
          echo "BOOT_PATH=$BOOT" >> "$GITHUB_OUTPUT"
          sudo chmod 644 "$ROOTFS" "$BOOT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-sheng-images
          path: |
            ${{ steps.find.outputs.ROOTFS_PATH }}
            ${{ steps.find.outputs.BOOT_PATH }}
          if-no-files-found: error
          compression-level: 0
